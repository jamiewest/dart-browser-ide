<!DOCTYPE html>
<!-- Boot page for code-oss in a browser tab. Derived from vscode-web's own
     out/vs/code/browser/workbench/workbench.html: same script order (which
     matters), but the stock workbench.js is replaced by boot.js so the
     construction options are built here instead of fetched from a product.json
     a server would have templated. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dart IDE</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dart IDE" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" href="vscode/favicon.ico" type="image/x-icon" />
    <link
      data-name="vs/workbench/workbench.web.main"
      rel="stylesheet"
      href="vscode/out/vs/workbench/workbench.web.main.css"
    />
    <style>
      /* Self-hosted, not a CDN: cross-origin isolation forbids third-party
         subresources, and this has to work offline. Cascadia and Inter are
         both OFL-1.1; the licences ship beside the files. Only the latin
         subsets are vendored (265 KB total).

         Two Cascadias, deliberately: `Code` has the programming ligatures and
         is the editor face; `Mono` is the same design with them switched off,
         for the places where a glyph standing for two characters is a lie
         about the bytes — the Debug Console, Output, the terminal — and for
         the small overlaid type (inlay hints, hovers, suggestions) where
         ligatures at 11px read as smudges. */
      @font-face {
        font-family: 'Cascadia Code Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 200 700;
        src: url('fonts/cascadia-code-latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Cascadia Code Variable';
        font-style: italic;
        font-display: swap;
        font-weight: 200 700;
        src: url('fonts/cascadia-code-latin-wght-italic.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Cascadia Mono Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 200 700;
        src: url('fonts/cascadia-mono-latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Cascadia Mono Variable';
        font-style: italic;
        font-display: swap;
        font-weight: 200 700;
        src: url('fonts/cascadia-mono-latin-wght-italic.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('fonts/inter-latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Inter Variable';
        font-style: italic;
        font-display: swap;
        font-weight: 100 900;
        src: url('fonts/inter-latin-wght-italic.woff2') format('woff2-variations');
      }

      /* The icon font the Flutter runtime already ships, borrowed for the
         icon previews beside `Icons.foo` (extensions/dart-wasm/src/icons.js).
         Only present in a `--with-flutter` build; when it is missing the
         previews simply do not draw. `block` rather than `swap` because the
         fallback for an icon codepoint is a tofu box. */
      @font-face {
        font-family: 'MaterialIcons';
        font-style: normal;
        font-display: block;
        src: url('toolchain/flutter_runtime/assets/fonts/MaterialIcons-Regular.otf')
          format('opentype');
      }

      html, body { height: 100%; margin: 0; overflow: hidden; }

      /* Fonts for everything VS Code does not expose a setting for.
         All of it turns on one trap, so it is one rule.

         VS Code stamps a platform class — `mac`, `windows`, `linux` — on the
         body, on `.monaco-workbench`, *and* on inner elements such as every
         `.monaco-scrollable-element`. Two things hang off it: the workbench UI
         font (`.mac { font-family: -apple-system, … }`) and
         `--monaco-monospace-font`, the variable behind inline code in hovers,
         suggestion details, parameter hints, the debug hover, and the
         Variables and Watch panes.

         So overriding on `.monaco-workbench` is not enough — the class comes
         back further down the tree and, on inheritance, the nearest definition
         wins however specific a further one is. That is why Inter sat in this
         file for a day without a single character ever being drawn in it: the
         workbench element did get Inter, and every list row inside it took
         `-apple-system` back from a `.mac` on a scroll container.

         Doubling the class matches exactly the same elements at a specificity
         of (0,2,0), which beats a bare `.mac` whatever the source order — and
         source order is not something to rely on when part of the workbench
         stylesheet is injected at runtime.

         The editor, terminal, Debug Console, inlay hints and CodeLens all do
         have settings, and are set in boot.js instead. */
      .mac.mac, .windows.windows, .linux.linux {
        font-family: 'Inter Variable', -apple-system, BlinkMacSystemFont,
          'Segoe UI', system-ui, sans-serif;
        font-feature-settings: 'cv05' 1, 'cv08' 1, 'ss03' 1;
        --monaco-monospace-font: 'Cascadia Mono Variable', ui-monospace, Menlo,
          Monaco, 'Courier New', monospace;
      }

      /* The Output view is a Monaco editor with no font setting of its own,
         and Monaco writes `font-family` *inline* on `.view-lines`, so only
         `!important` reaches it. Safe to do: Cascadia Mono is Cascadia Code
         with the ligatures removed, so the advance width per character is
         identical and Monaco's cursor arithmetic still lines up. */
      .monaco-workbench .output-view .monaco-editor .view-lines {
        font-family: 'Cascadia Mono Variable', ui-monospace, Menlo, monospace
          !important;
        font-feature-settings: normal !important;
      }

      #boot-error {
        display: none; position: fixed; inset: 0; z-index: 10;
        padding: 24px; font: 13px/1.5 'Cascadia Mono Variable', ui-monospace, monospace;
        white-space: pre-wrap; background: #ffffff; color: #cf222e;
      }
    </style>
  </head>

  <body aria-label=""></body>

  <pre id="boot-error"></pre>

  <script>
    // Cross-origin isolation: served by headers in development, and by a
    // service worker on a static host that cannot set them (GitHub Pages).
    // The first load registers and reloads once; later loads are already
    // isolated and skip both.
    if (!crossOriginIsolated && 'serviceWorker' in navigator) {
      navigator.serviceWorker
        .register(new URL('coi-serviceworker.js', document.baseURI), {
          scope: new URL('.', document.baseURI).pathname,
        })
        .then((registration) => {
          if (registration.active && !navigator.serviceWorker.controller) {
            window.location.reload();
          }
          registration.addEventListener('updatefound', () => {
            registration.installing?.addEventListener('statechange', (event) => {
              if (event.target.state === 'activated') window.location.reload();
            });
          });
        })
        .catch((error) => {
          // Recorded, not thrown in the user's face: without isolation the
          // editor, analysis, pub, and running code all still work — only
          // breakpoints do not, and the extension says so where that matters.
          // (The overlay this used to use is for fatal boot failures; a
          // non-fatal warning must not cover the workbench.)
          window.__coiError = String(error);
          console.warn(`cross-origin isolation unavailable: ${error}`);
        });
    }
  </script>

  <!-- Startup (do not modify order of script tags!) -->
  <script src="vscode/out/vs/loader.js"></script>
  <script src="vscode/out/vs/webPackagePaths.js"></script>
  <script>
    // Relative to the document base, never to the origin: on GitHub Pages the
    // app lives under /<repo>/.
    const appBase = new URL('.', document.baseURI).toString();
    const baseUrl = new URL('vscode', appBase).toString();
    Object.keys(self.webPackagePaths).forEach((key) => {
      self.webPackagePaths[key] =
        `${baseUrl}/node_modules/${key}/${self.webPackagePaths[key]}`;
    });
    require.config({
      baseUrl: `${baseUrl}/out`,
      recordStats: true,
      trustedTypesPolicy: window.trustedTypes?.createPolicy('amdLoader', {
        createScriptURL(value) {
          if (value.startsWith(window.location.origin)) return value;
          throw new Error(`Invalid script url: ${value}`);
        },
      }),
      paths: self.webPackagePaths,
    });
    window.addEventListener('error', (event) => {
      const el = document.getElementById('boot-error');
      el.style.display = 'block';
      el.textContent += `${event.message}\n    ${event.filename}:${event.lineno}\n`;
    });
  </script>
  <script src="vscode/out/vs/workbench/workbench.web.main.nls.js"></script>
  <script src="vscode/out/vs/workbench/workbench.web.main.js"></script>
  <script src="boot.js"></script>
</html>
